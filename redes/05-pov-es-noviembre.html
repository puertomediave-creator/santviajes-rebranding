<!doctype html><html lang="es"><head><meta charset="utf-8"><title>POV: Es noviembre</title>
<link rel="stylesheet" href="../fonts/sv-conecta-embebida.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="posts.css">
<style>
.post{background:var(--corazon)}
.head{position:absolute;top:175px;left:66px;right:66px;z-index:3}
.pov{font-size:60px;font-weight:900;color:var(--arena)}
.nov{font-size:150px;color:var(--sol);margin-top:8px}
.sub{font-size:46px;font-weight:700;color:#fff;margin-top:22px;line-height:1.05;max-width:500px}
.top img{background:var(--noche);padding:12px 22px;border-radius:24px;height:104px}
.handle{background:var(--noche)!important}
.phone{position:absolute;right:60px;top:560px;width:420px;height:640px;background:var(--noche);border-radius:56px;padding:20px;z-index:3;box-shadow:0 0 0 10px #fff,0 30px 50px rgba(0,0,0,.3);transform:rotate(6deg)}
.scr{width:100%;height:100%;background:var(--arena);border-radius:40px;padding:26px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.cal{align-self:center;width:170px;border-radius:24px;overflow:hidden;background:#fff;text-align:center;box-shadow:0 6px 0 var(--noche)}
.cal div{background:var(--corazon);color:#fff;font-weight:900;font-size:30px;padding:6px}
.cal b{display:block;font-size:84px;font-weight:900;color:var(--noche);line-height:1.1}
.msg{font-family:var(--b);font-weight:500;font-size:24px;line-height:1.3;padding:14px 18px;border-radius:24px;max-width:85%}
.in{background:#fff;color:var(--noche);border-bottom-left-radius:6px}
.out{background:var(--brisa);color:var(--noche);align-self:flex-end;border-bottom-right-radius:6px}
.steps{position:absolute;left:66px;top:760px;z-index:3;display:grid;gap:16px}
.steps span{font-weight:900;font-size:50px;color:#fff;display:flex;align-items:center;gap:16px}
.steps i{font-style:normal;width:62px;height:62px;border-radius:50%;background:var(--noche);color:var(--sol);display:grid;place-items:center;font-size:32px}
.cta{position:absolute;left:66px;top:1100px;z-index:4;background:var(--noche);color:#fff;font-size:36px;box-shadow:0 0 0 8px #fff}
.cta b{color:var(--sol)}
</style></head><body>
<div class="post">
<svg class="layer" viewBox="0 0 1080 1350" aria-hidden="true">
  <circle cx="1000" cy="200" r="300" fill="#F7C64A" opacity=".25"/>
  <path d="M40 700 C 200 640 300 760 420 700" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 20" opacity=".6"/>
</svg>
<div class="top"><img src="../logos/logo-horizontal-oscuro.svg" alt=""><span class="handle">@sant_viajesoficial</span></div>
<div class="head">
  <div class="pov">POV:</div>
  <div class="stk nov" data-t="Es noviembre">Es noviembre</div>
  <div class="sub">y aún no has viajado este año…</div>
</div>
<div class="phone"><div class="scr">
  <div class="cal"><div>NOV</div><b>30</b></div>
  <div class="msg in">¿Y el viaje de este año? 👀</div>
  <div class="msg out">¡Aún estás a tiempo! ✈ Te armamos el plan.</div>
  <div class="msg in">¿Cuánto me sale? 🙏</div>
</div></div>
<div class="steps"><span><i>1</i>Reserva</span><span><i>2</i>Empaca</span><span><i>3</i>Disfruta</span></div>
<span class="pill cta">Escríbenos ☎ <b>301 952 3262</b></span>
<div class="foot"><span>RNT 251308</span><span>WhatsApp <b>301 952 3262</b></span><span>santviajes.com</span></div>
</div>
</body></html>
